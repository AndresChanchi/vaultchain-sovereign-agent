[package]
name = "kipio_access"
version = "0.1.0"
edition = "2024"

[dependencies]
stylus-sdk = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-sol-types/std",
]
export-abi = ["stylus-sdk/export-abi"]

[dev-dependencies]
stylus-test = "0.10.9"

[lib]
crate-type = ["lib","cdylib"]

[[bin]]
name = "export-abi"
path = "src/bin/export_abi.rs"

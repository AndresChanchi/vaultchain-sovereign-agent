[package]
name = "kipio_recovery"
version = "0.2.0" # I've been forgetting to update the versions...
edition = "2024"

[dependencies]
stylus-sdk = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }

[dev-dependencies]
stylus-test = "0.10.9"

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-sol-types/std",
]

export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib","cdylib"]

[[bin]]
name = "export-abi"
path = "src/bin/export-abi.rs"

[workspace]
members = [
  "src/kipio_core",              # Protocol
  "src/kipio_auth",              # Business Logic -> cold
# "src/kipio_auth_verifier_k256",
  "src/kipio_account",           # Sovereign Account -> hot
  "src/kipio_economics",         # Business Logic    -> hot
  "src/kipio_content_access",  # Business Logic    -> hot
  "src/kipio_runtime",           # Sovereign Account -> hot
  "src/kipio_execution_gateway", # Business Logic    -> hot
  "src/kipio_recovery",          # Business Logic    -> cold
  "src/kipio_protocol_config",   # Protocol maintainers 
  "src/bridge",                  # Local too, soon a public crate
  "tests",
  ]

# kipio_registry_content + kipio_access
# kipio_execution_gateway + kipio_runtime
# kipio_account + kipio_recovery
# kipio_auth crypto agile, es posible combinarlo con el primero o el ultra honk, no se.. jmm

resolver = "3"

[workspace.dependencies]
# Enable mini-alloc to efficiently handle Vec/String in WASM
# https://github.com/OffchainLabs/stylus-sdk-rs/releases
# https://docs.rs/stylus-sdk/latest/stylus_sdk/
stylus-sdk = { version = "0.10.9", features = ["mini-alloc", "hostio"] }
# https://crates.io/crates/alloy-primitives 
alloy-primitives = { version = "1.7.3", default-features = false }
# https://crates.io/crates/alloy-sol-types 
alloy-sol-types = { version = "1.7.3", default-features = false }

# k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }


[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "z" # Maximum size reduction for deployment
panic = "abort"
strip = true

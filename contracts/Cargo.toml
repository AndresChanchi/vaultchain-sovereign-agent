[package]
name = "vaultchain-contract"
version = "0.1.0"
edition = "2024"

[dependencies]
# Habilitamos mini-alloc como feature para manejar Vec/String eficientemente en WASM
stylus-sdk = { version = "0.10.2", features = ["mini-alloc", "hostio"] }
alloy-primitives = { version = "0.8.20", default-features = false }
alloy-sol-types = { version = "0.8.20", default-features = false }

[dev-dependencies]
# Motsu 0.10.0 es el estándar de testing para ArbOS 52
motsu = "0.10.0"
arbitrary = { version = "1.4", features = ["derive"] }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-sol-types/std",
]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "z" # Máxima reducción de tamaño para el despliegue
panic = "abort"
strip = true

[package]
name = "kipio_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
kipio_account_bridge = { path = "../bridge" }
stylus-sdk = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }

[dev-dependencies]
stylus-test = "0.10.9"

[features]
contract-client-gen = []
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "export-abi"
path = "src/bin/export_abi.rs"
